name: pawn_shop
description: "Premium Pawn Shop Management Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.8 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.5.3
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  
  # State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.1
  
  # Backend & Authentication
  supabase_flutter: ^2.0.2
  
  # Security
  flutter_secure_storage: ^9.0.0
  
  # Utilities
  intl: ^0.19.0
  dio: ^5.3.0
  image_picker: ^1.1.2
  pointer_interceptor: ^0.10.1
  flutter_dotenv: ^5.1.0
  uuid: ^4.0.0
  equatable: ^2.0.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.0
  mocktail: ^1.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/pawnshop_app_icon.png
  adaptive_icon_background: "#141416"
  adaptive_icon_foreground: assets/icons/pawnshop_app_icon.png